<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" />
</head>
<body>

    <a href="javascript:void(0);" onclick="history.back();" class="close-btn" aria-label="Close and go back">
        <i class="fas fa-times"></i>
    </a>

    <section id="prodetails" class="prodetails-section section-padding">
  
        <div class="single-pro-image">
            <img src="img/bottles/metal3a.png" width="100%" id="main-image" alt="Product Main Image">
            
            <div class="small-image-group">
                <div class="small-image-column active">
                    <img src="img/bottles/metal3a.png" width="100%" class="small-image" alt="Blue variant">
                </div>
                <div class="small-image-column">
                    <img src="img/bottles/roseGreen.png" width="100%" class="small-image" alt="Orange variant">
                </div>
                <div class="small-image-column">
                    <img src="img/bottles/roseRoyal.png" width="100%" class="small-image" alt="Pink variant">
                </div>
                <div class="small-image-column">
                    <img src="img/bottles/roseMint.png" width="100%" class="small-image" alt="Clear variant">
                </div>
            </div>
        </div>

        <div class="single-pro-details">
            <h6>Metal (Durable)</h6>
            <h4>Rose Quartz</h4>
            <h2 id="price-display">2500.00</h2>
            
            <div class="purchase-options">
                <select id="size-select">
                     <option value="12 oz" data-price="2000">12 oz</option>
                    <option value="20 oz" data-price="2500" selected>20 oz</option>
                    <option value="32 oz" data-price="2999">32 oz</option>
                </select>
                <div>
                    <input type="number" id="product-quantity" value="1" min="1">
                    <button class="normal unique-details-btn"
                        id="single-add-btn"
                        data-name="Rose Quartz"
                        data-price="2500"
                        data-image="img/bottles/metal3a.png">
                        Add To Cart
                    </button>
                </div>
            </div>

            <h4>Product Details</h4>
            <span class="para">A soft, radiant pastel pink hue with a subtle satiny shimmer designed to bring a sense of mindful elegance and calm to your daily wellness routine.</span>
        </div>
    </section>

    <script src="script.js"></script>
    <div id="toast-container"></div>
</body>
</html>
