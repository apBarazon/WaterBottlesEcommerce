<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" />
</head>
<body>

    
    <a href="javascript:void(0);" onclick="history.back();" class="close-btn" aria-label="Close and go back">
        <i class="fas fa-times"></i>
    </a>


    <section id="prodetails" class="prodetails-section section-padding">
  
        <div class="single-pro-image">
            <img src="img/bottles/mug1.png" width="100%" id="main-image" alt="Product Main Image">
            
            
        </div>

        
        <div class="single-pro-details">
            <h6>Coffe Lover</h6>
            <h4>HydroMug</h4>
            <h2>₱1500.00</h2>
            
            <div class="purchase-options">
                
                <select id="size-select">
                    <option value="12 oz" data-price="1000">12 oz</option>
                    <option value="20 oz" data-price="1500" selected>20 oz</option>
                    <option value="32 oz" data-price="2100">32 oz</option>
                </select>
                <div>
                    <input type="number" id="product-quantity" value="1" min="1">
                   <button class="normal unique-details-btn"
                        id="single-add-btn"
                        data-name="HydroMug"
                        data-price="1500"
                        data-image="img/bottles/mug1.png">
                    Add To Cart
                </button>
                </div>
            </div>

            <h4>Product Details</h4>
            <span class="para">A sleek, minimalist stainless steel mug with a premium champagne-gold finish built to keep your brews hot for hours.</span>
        </div>
    </section>

    
  <script src="script.js"></script>
  <div id="toast-container"></div>
</body>
</html>
